<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BayanQuran — the verse, checked at the letter</title>
<meta name="description" content="Pick any verse of the Quran and see it verified letter-for-letter against three published Uthmani editions.">
<link rel="stylesheet" href="/static/style.css?v=__V__">
</head>
<body>
  <header class="top">
    <button id="menuBtn" class="icon menu-btn" aria-label="Browse surahs" aria-expanded="false" title="Browse surahs">☰</button>
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">ب</span>
      <div class="brand-text">
        <h1>BayanQuran <span class="brand-ar">بيان</span></h1>
        <p>Quran verses, checked at the letter</p>
      </div>
    </div>

    <div class="search">
      <input id="q" type="search" autocomplete="off" spellcheck="false"
             placeholder="Search Arabic letters or an English / Malay translation…"
             aria-label="Search the Quran">
      <kbd>/</kbd>
    </div>

    <div class="top-actions">
      <div class="seg" id="langSeg" role="group" aria-label="Translation language">
        <button data-lang="en" class="on">EN</button>
        <button data-lang="ms">MS</button>
      </div>
      <button id="guidesBtn" class="ghost" title="Kuliah, khutbah &amp; panduan solat sunat">Kuliah</button>
      <button id="randomBtn" class="ghost" title="Jump to a random verse">Random</button>
      <button id="statusBtn" class="pill" title="Corpus integrity report">
        <span class="dot ok"></span><span id="statusLabel">checking…</span>
      </button>
      <button id="themeBtn" class="icon" title="Light / dark" aria-label="Toggle theme">◐</button>
    </div>
  </header>

  <div class="workspace" id="workspace">
    <aside class="sidebar">
      <div class="side-head">
        <input id="surahFilter" type="search" placeholder="Filter surahs…" autocomplete="off" aria-label="Filter surahs">
        <span class="count" id="surahCount"></span>
      </div>
      <nav id="surahList" class="surah-list" aria-label="Surahs"></nav>
    </aside>

    <main class="reader" id="reader">
      <div class="reader-inner" id="readerInner">
        <div class="empty">Loading the corpus…</div>
      </div>
    </main>

    <aside class="inspector" id="inspector" aria-label="Verse verification" hidden>
      <div class="insp-inner" id="inspInner"></div>
    </aside>
  </div>

  <div class="modal" id="statusModal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="statusTitle">
      <div class="modal-head">
        <h2 id="statusTitle">How these verses are verified</h2>
        <button class="icon" id="statusClose" aria-label="Close">✕</button>
      </div>
      <div id="statusBody" class="modal-body"></div>
    </div>
  </div>

  <div class="modal" id="guidesModal" hidden>
    <div class="modal-card wide" role="dialog" aria-modal="true" aria-labelledby="guidesTitle">
      <div class="modal-head">
        <h2 id="guidesTitle">Kuliah &amp; Panduan</h2>
        <div class="g-tabs" id="guidesTabs" role="tablist">
          <button data-gtab="khutbah" role="tab" class="on">Kuliah &amp; Ceramah</button>
          <button data-gtab="solat" role="tab">Solat Sunat</button>
        </div>
        <button class="icon" id="guidesClose" aria-label="Tutup">✕</button>
      </div>
      <div id="guidesBody" class="modal-body guides-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <div class="player" id="player" hidden>
    <div class="p-controls">
      <button class="icon" id="pPrev" title="Previous verse" aria-label="Previous verse">⏮</button>
      <button class="playbtn" id="pPlay" aria-label="Play">▶</button>
      <button class="icon" id="pNext" title="Next verse" aria-label="Next verse">⏭</button>
    </div>
    <div class="p-meta">
      <div class="p-row"><span id="pRef" class="p-ref">—</span><span id="pSurah" class="p-surah"></span></div>
      <div class="p-row p-sub"><span id="pReciter"></span><span class="p-dot">·</span><span id="pState">ready</span></div>
    </div>
    <div class="p-track"><div class="p-fill" id="pFill"></div></div>
    <div class="p-time" id="pTime">0:00</div>
    <select id="pEdition" class="p-select" aria-label="Reciter"></select>
    <button class="icon" id="pClose" title="Close player" aria-label="Close player">✕</button>
  </div>

  <script src="/static/app.js?v=__V__"></script>
</body>
</html>
