<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tawatur — the verse, checked at the letter</title>
<meta name="description" content="Pick any verse of the Quran and see it verified letter-for-letter against three published Uthmani editions. Free to use, no account, nothing to install.">
<link rel="stylesheet" href="/static/style.css?v=__V__">
</head>
<body>
  <header class="top">
    <button id="menuBtn" class="icon menu-btn" aria-label="Browse surahs" aria-expanded="false" title="Browse surahs">☰</button>
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">ب</span>
      <div class="brand-text">
        <h1>Tawatur <span class="brand-ar">تواتر</span></h1>
        <p>Quran verses, checked at the letter</p>
      </div>
    </div>

    <div class="search">
      <input id="q" type="search" autocomplete="off" spellcheck="false"
             placeholder="Search Arabic letters or an English / Malay translation…"
             aria-label="Search the Quran">
      <kbd>/</kbd>
    </div>

    <div class="top-actions">
      <div class="seg" id="langSeg" role="group" aria-label="Translation language">
        <button data-lang="en" class="on">EN</button>
        <button data-lang="ms">MS</button>
      </div>
      <button id="guidesBtn" class="ghost" title="Kuliah, khutbah &amp; panduan solat sunat">Kuliah</button>
      <button id="randomBtn" class="ghost" title="Jump to a random verse">Random</button>
      <button id="statusBtn" class="pill" title="Corpus integrity report">
        <span class="dot ok"></span><span id="statusLabel">checking…</span>
      </button>
      <div class="seg size-seg" role="group" aria-label="Arabic text size">
        <button id="verseMinus" title="Smaller Arabic text" aria-label="Smaller Arabic text">A−</button>
        <button id="versePlus" title="Larger Arabic text" aria-label="Larger Arabic text">A+</button>
      </div>
      <div class="reading-wrap" id="readingWrap">
        <button id="readingBtn" class="icon" title="Reading preferences" aria-label="Reading preferences" aria-expanded="false" aria-controls="readingPanel">Aa</button>
        <div class="reading-panel" id="readingPanel" role="dialog" aria-label="Reading preferences" hidden>
          <div class="rp-head">
            <h2>Reading</h2>
            <button class="icon" id="readingClose" aria-label="Close reading preferences">✕</button>
          </div>
          <div class="rp-row">
            <label class="rp-label" for="trSize">Translation size</label>
            <span class="rp-val" id="trSizeVal">12.5 px</span>
          </div>
          <input id="trSize" class="rp-range" type="range" min="12" max="20" step="0.5" value="12.5" aria-label="Translation text size">

          <div class="rp-row"><label class="rp-label" for="arabicFont">Arabic typeface</label></div>
          <select id="arabicFont" class="rp-select" aria-label="Arabic typeface">
            <option value="amiri">Amiri Quran</option>
            <option value="serif">System serif</option>
          </select>

          <div class="rp-row"><span class="rp-label" id="trShowLabel">Translation</span></div>
          <div class="seg rp-seg" role="group" aria-labelledby="trShowLabel">
            <button data-tr="show" class="on">Show</button>
            <button data-tr="hide">Hide</button>
          </div>

          <div class="rp-row"><label class="rp-label" for="surahSort">Surah order</label></div>
          <select id="surahSort" class="rp-select" aria-label="Surah order">
            <option value="canonical">Canonical</option>
            <option value="name">Name A–Z</option>
            <option value="long">Longest first</option>
            <option value="short">Shortest first</option>
          </select>

          <div class="rp-row"><span class="rp-label" id="followLabel">Follow recitation</span></div>
          <div class="seg rp-seg" role="group" aria-labelledby="followLabel">
            <button data-follow="on">On</button>
            <button data-follow="off" class="on">Off</button>
          </div>

          <div class="rp-foot">
            <span class="rp-hint">Saved on this device only.</span>
            <button id="readingReset" class="ghost rp-reset">Reset</button>
          </div>
        </div>
      </div>
      <button id="themeBtn" class="icon" title="Light / dark" aria-label="Toggle theme">◐</button>
    </div>
  </header>

  <div class="workspace" id="workspace">
    <aside class="sidebar">
      <div class="side-head">
        <input id="surahFilter" type="search" placeholder="Filter surahs…" autocomplete="off" aria-label="Filter surahs">
        <span class="count" id="surahCount"></span>
      </div>
      <button id="marksBtn" class="side-marks" aria-pressed="false" title="Show only the verses you bookmarked">
        <span class="star" aria-hidden="true">☆</span> Marked
        <span class="count" id="marksCount"></span>
      </button>
      <nav id="surahList" class="surah-list" aria-label="Surahs"></nav>
    </aside>

    <main class="reader" id="reader">
      <div class="reader-inner" id="readerInner">
        <div class="empty">Loading the corpus…</div>
      </div>
    </main>

    <aside class="inspector" id="inspector" aria-label="Verse verification" hidden>
      <div class="insp-inner" id="inspInner"></div>
    </aside>
  </div>

  <div class="modal" id="statusModal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="statusTitle">
      <div class="modal-head">
        <h2 id="statusTitle">How these verses are verified</h2>
        <button class="icon" id="statusClose" aria-label="Close">✕</button>
      </div>
      <div id="statusBody" class="modal-body"></div>
    </div>
  </div>

  <div class="modal" id="guidesModal" hidden>
    <div class="modal-card wide" role="dialog" aria-modal="true" aria-labelledby="guidesTitle">
      <div class="modal-head">
        <h2 id="guidesTitle">Kuliah &amp; Panduan</h2>
        <div class="g-tabs" id="guidesTabs" role="tablist">
          <button data-gtab="khutbah" role="tab" class="on">Kuliah &amp; Ceramah</button>
          <button data-gtab="solat" role="tab">Solat Sunat</button>
        </div>
        <button class="icon" id="guidesClose" aria-label="Tutup">✕</button>
      </div>
      <div id="guidesBody" class="modal-body guides-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <div class="player" id="player" hidden>
    <div class="p-controls">
      <button class="icon" id="pPrev" title="Previous verse" aria-label="Previous verse">⏮</button>
      <button class="playbtn" id="pPlay" aria-label="Play">▶</button>
      <button class="icon" id="pNext" title="Next verse" aria-label="Next verse">⏭</button>
    </div>
    <div class="p-meta">
      <div class="p-row"><span id="pRef" class="p-ref">—</span><span id="pSurah" class="p-surah"></span></div>
      <div class="p-row p-sub"><span id="pReciter"></span><span class="p-dot">·</span><span id="pState">ready</span></div>
    </div>
    <div class="p-track"><div class="p-fill" id="pFill"></div></div>
    <div class="p-time" id="pTime">0:00</div>
    <select id="pEdition" class="p-select" aria-label="Reciter"></select>
    <button class="icon" id="pClose" title="Close player" aria-label="Close player">✕</button>
  </div>

  <script src="/static/app.js?v=__V__"></script>
</body>
</html>
